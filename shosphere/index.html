<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1>ShopSphere<span>.</span></h1>

        <input type="text" id="search"
               placeholder="Search products...">

        <button id="cart-button">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
    </header>

    <section class="hero">
        <div>
            <p class="tagline">YOUR EVERYDAY SHOPPING DESTINATION</p>
            <h2>Find Your Next<br>Favorite Thing.</h2>
            <p>Explore our collection of everyday essentials.</p>
            <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
                Shop Now →
            </button>
        </div>
    </section>

    <main id="products">
        <h2>Featured Products</h2>
        <p class="subtitle">Discover something you'll love.</p>

        <div id="product-list" class="product-grid"></div>
        <p id="empty-message" hidden>No products found.</p>
    </main>

    <footer>
        <h2>ShopSphere.</h2>
        <p>Shopping made simple.</p>
        <p>© 2026 ShopSphere. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
